[build-system]
requires = [
    "setuptools",
    "wheel"
]
build-backend = "setuptools.build_meta"

[project]
name = "netbox-zabbix"
authors = [
    {name = "Daniel Sheppard", email = "dans@dansheps.com"}
]
maintainers = [
    {name = "Daniel Sheppard", email = "dans@dansheps.com"},
]
description = "Plugin to Sync Devices to Zabbix"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["netbox-plugin", ]
version = "2.0.2"
license = {file = "LICENSE"}
classifiers = [
    "Programming Language :: Python :: 3",
]
dependencies = [
    'zabbix_utils'
]

[project.urls]
Documentation = "https://github.com/dansheps/netbox-zabbix/blob/main/README.md"
Source = "https://github.com/dansheps/netbox-zabbix"
Tracker = "https://github.com/dansheps/netbox-zabbix/issues"

[tool.setuptools.packages.find]
exclude=["netbox_zabbix.tests"]

[tool.black]
skip-string-normalization = 1